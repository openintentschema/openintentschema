<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" role="img" aria-label="OIS records stay in your organization unless you send them" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b7791f"/>
    </marker>
  </defs>
  <rect width="760" height="612" fill="#ffffff"/>

  <text x="16" y="32" font-size="18" font-weight="600" fill="#1b1f24">OIS records stay in your organization unless you send them</text>
  <text x="16" y="54" font-size="13.5" fill="#57606a">What the OIS tools read, write and transmit</text>

  <!-- your organization -->
  <rect x="16" y="72" width="728" height="326" rx="10" fill="#f3f8f4" stroke="#2f7d4f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="100" font-size="15" font-weight="600" fill="#1f5c38">Your organization: your CI runner or workstation</text>

  <g font-size="14" fill="#1b1f24">
    <rect x="36" y="120" width="140" height="58" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="106" y="145" text-anchor="middle" font-weight="600">Test run</text>
    <text x="106" y="165" text-anchor="middle" font-size="12.5" fill="#57606a">your tests, as today</text>

    <rect x="212" y="120" width="140" height="58" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="282" y="145" text-anchor="middle" font-weight="600">JUnit XML</text>
    <text x="282" y="165" text-anchor="middle" font-size="12.5" fill="#57606a">report file</text>

    <rect x="388" y="120" width="140" height="58" rx="8" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="458" y="145" text-anchor="middle" font-weight="600">ois-junit</text>
    <text x="458" y="165" text-anchor="middle" font-size="12.5" fill="#57606a">converts locally</text>

    <rect x="564" y="120" width="160" height="58" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="644" y="145" text-anchor="middle" font-weight="600">OIS bundle</text>
    <text x="644" y="165" text-anchor="middle" font-size="12.5" fill="#57606a">JSON file</text>

    <rect x="388" y="250" width="140" height="58" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="458" y="275" text-anchor="middle" font-weight="600">Git checkout</text>
    <text x="458" y="295" text-anchor="middle" font-size="12.5" fill="#57606a">read only, no fetch</text>

    <rect x="564" y="230" width="160" height="58" rx="8" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="644" y="255" text-anchor="middle" font-weight="600">ois-validator</text>
    <text x="644" y="275" text-anchor="middle" font-size="12.5" fill="#57606a">checks locally</text>

    <rect x="564" y="322" width="160" height="58" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="644" y="347" text-anchor="middle" font-weight="600">Your storage</text>
    <text x="644" y="367" text-anchor="middle" font-size="12.5" fill="#57606a">CI artifacts</text>
  </g>

  <g fill="none" stroke="#5b6472" stroke-width="1.25">
    <path d="M176 149H212" marker-end="url(#arrow)"/>
    <path d="M352 149H388" marker-end="url(#arrow)"/>
    <path d="M528 149H564" marker-end="url(#arrow)"/>
    <path d="M458 250V178" marker-end="url(#arrow)"/>
    <path d="M644 178V230" marker-end="url(#arrow)"/>
    <path d="M644 288V322" marker-end="url(#arrow)"/>
  </g>
  <text x="446" y="206" text-anchor="end" font-size="12.5" fill="#57606a">reads test files, commit</text>
  <text x="446" y="222" text-anchor="end" font-size="12.5" fill="#57606a">and remote URL,</text>
  <text x="446" y="238" text-anchor="end" font-size="12.5" fill="#57606a">credentials removed</text>

  <text x="36" y="350" font-size="14" font-weight="600" fill="#1f5c38">Neither tool opens a network connection.</text>
  <text x="36" y="370" font-size="12.5" fill="#1f5c38">Verified: both run with all network access blocked.</text>

  <!-- links leaving the organization -->
  <g fill="none" stroke="#b7791f" stroke-width="1.25">
    <path d="M131 398V470" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>
  </g>
  <g fill="none" stroke="#5b6472" stroke-width="1.25" stroke-dasharray="4 3">
    <path d="M380 398V470" marker-end="url(#arrow)"/>
    <path d="M629 398V470" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12.5" fill="#57606a">
    <text x="141" y="438">install only</text>
    <text x="390" y="438">only if you send it</text>
    <text x="639" y="438">only what you post</text>
  </g>

  <!-- outside -->
  <g font-size="14" fill="#1b1f24">
    <rect x="16" y="470" width="230" height="122" rx="8" fill="#fff8ec" stroke="#b7791f"/>
    <text x="32" y="496" font-weight="600">PyPI (pypi.org)</text>
    <text x="32" y="518" font-size="12.5" fill="#57606a">on install: IP address,</text>
    <text x="32" y="536" font-size="12.5" fill="#57606a">installer, Python and OS</text>
    <text x="32" y="554" font-size="12.5" fill="#57606a">version, CI or not</text>
    <text x="32" y="576" font-size="12.5" fill="#57606a">avoid: internal mirror</text>

    <rect x="265" y="470" width="230" height="122" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="281" y="496" font-weight="600">Recipients you choose</text>
    <text x="281" y="518" font-size="12.5" fill="#57606a">auditor, customer, regulator</text>
    <text x="281" y="536" font-size="12.5" fill="#57606a">receive bundles or passports</text>
    <text x="281" y="554" font-size="12.5" fill="#57606a">only when you send them</text>

    <rect x="514" y="470" width="230" height="122" rx="8" fill="#ffffff" stroke="#5b6472"/>
    <text x="530" y="496" font-weight="600">OIS project</text>
    <text x="530" y="518" font-size="12.5" fill="#57606a">website: GitHub Pages logs</text>
    <text x="530" y="536" font-size="12.5" fill="#57606a">issues, pull requests: public</text>
    <text x="530" y="554" font-size="12.5" fill="#57606a">editors@ mail: Proton Mail</text>
  </g>
</svg>
